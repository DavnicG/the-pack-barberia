{% extends "base.html" %}

{% block title %}Barberos - The Pack{% endblock %}

{% block content %}
    <h1>Nuestros Barberos</h1>
    
    {% for barbero in barberos %}
        <div>
            <h2>{{ barbero.nombre }}</h2>
            <p>{{ barbero.especialidad }}</p>
        </div>
    {% empty %}
        <p>No hay barberos.</p>
    {% endfor %}
{% endblock %}
